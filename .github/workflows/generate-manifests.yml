name: Generate photo manifests and thumbnails

# Runs automatically whenever anything under photos/ changes (upload,
# delete, rename), and can also be triggered manually from the Actions
# tab if you ever want to force a refresh.
on:
  push:
    paths:
      - "photos/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run generate-manifest

      - name: Commit generated manifests and thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests thumbs
          git diff --staged --quiet || git commit -m "Auto-update photo manifests and thumbnails"
          git push
